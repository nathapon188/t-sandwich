[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/orders.json"]

# Front end calls /api/orders; Netlify routes it to the function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single page app fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
